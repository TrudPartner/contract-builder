<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Конструктор договора на СОУТ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #e9eff5; padding: 30px 20px; color: #111; }
  .container { max-width: 1300px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 26px; color: #003366; display: flex; align-items: center; gap: 10px; }
  .header h1 small { font-size: 15px; font-weight: 400; color: #4a6f8f; }
  .header-actions { display: flex; gap: 12px; }
  .btn { padding: 8px 22px; border: none; border-radius: 40px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.15s; }
  .btn-primary { background: #003366; color: #fff; }
  .btn-primary:hover { background: #002244; }
  .btn-success { background: #1e8b4c; color: #fff; }
  .btn-success:hover { background: #15703d; }
  .btn-word { background: #2b5797; color: #fff; }
  .btn-word:hover { background: #1d3f6e; }
  .grid-2 { display: grid; grid-template-columns: 380px 1fr; gap: 28px; }
  .form-panel { background: #fff; border-radius: 24px; padding: 24px 26px; box-shadow: 0 8px 30px rgba(0, 30, 60, 0.08); max-height: calc(100vh - 150px); overflow-y: auto; }
  .form-panel::-webkit-scrollbar { width: 4px; }
  .form-panel::-webkit-scrollbar-thumb { background: #b6ccdd; border-radius: 10px; }
  .form-panel h2 { font-size: 17px; color: #003366; border-bottom: 2px solid #e6f0fa; padding-bottom: 12px; margin-bottom: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: #1a3a5f; margin-bottom: 3px; }
  .field input { width: 100%; padding: 7px 11px; border: 1px solid #d0dcec; border-radius: 8px; font-size: 14px; transition: 0.15s; background: #fff; }
  .field input:focus { border-color: #2b7bb6; outline: none; box-shadow: 0 0 0 3px rgba(43, 123, 182, 0.12); }
  .field input:read-only { background: #f5f7fa; color: #555; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sum-block { background: #f8faff; border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .sum-block .line { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .sum-block .line.total { font-size: 18px; font-weight: 700; color: #003366; border-top: 2px solid #e6f0fa; padding-top: 8px; margin-top: 4px; }
  .sum-block .num2text { text-align: right; font-size: 13px; color: #1a3a5f; font-style: italic; margin-top: 4px; }
  .btn-group { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .preview-panel { background: #fff; border-radius: 24px; padding: 24px 28px; box-shadow: 0 8px 30px rgba(0, 30, 60, 0.08); max-height: calc(100vh - 150px); overflow-y: auto; position: relative; }
  .preview-panel::-webkit-scrollbar { width: 4px; }
  .preview-panel::-webkit-scrollbar-thumb { background: #b6ccdd; border-radius: 10px; }
  .preview-panel .preview-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e6f0fa; padding-bottom: 12px; margin-bottom: 16px; font-size: 17px; font-weight: 700; color: #003366; }
  .preview-panel .preview-header .badge { font-size: 12px; font-weight: 600; padding: 2px 12px; border-radius: 40px; background: #e1f3e6; color: #1a6e3a; }
  .contract-preview { font-family: 'Arial Narrow', Arial, sans-serif; font-size: 11pt; line-height: 1.4; color: #000; padding: 0; max-width: 100%; }
  .contract-preview table.data { border-collapse: collapse; width: 100%; margin: 8px auto; font-size: 10pt; page-break-inside: avoid; break-inside: avoid; }
  .contract-preview table.data td, .contract-preview table.data th { border: 1px solid #000; padding: 4px 8px; text-align: center; page-break-inside: avoid; break-inside: avoid; }
  .contract-preview table.data tr { page-break-inside: avoid; break-inside: avoid; }
  .contract-preview table.data td:first-child, .contract-preview table.data th:first-child { width: 40px; }
  .contract-preview table.data td:nth-child(2) { text-align: left; }
  .contract-preview table.data td:last-child, .contract-preview table.data th:last-child { text-align: right; }
  .contract-preview ul { padding-left: 25px; margin: 4px 0; }
  .contract-preview .signatures { margin-top: 24px; page-break-inside: avoid; break-inside: avoid; }
  .contract-preview .center { text-align: center; }
  .contract-preview .bold { font-weight: bold; }
  .contract-preview .right { text-align: right; }
  .contract-preview .left { text-align: left; }
  .contract-preview p { margin: 6px 0; text-align: justify; text-indent: 1.25cm; }
  .contract-preview p.no-indent { text-indent: 0; }
  .contract-preview .section-title { font-weight: bold; text-align: center; margin-top: 16px; margin-bottom: 8px; font-size: 12pt; page-break-after: avoid; break-after: avoid; }
  .contract-preview .sig-table { width: 100%; border: none; margin-top: 24px; border-collapse: collapse; page-break-inside: avoid; break-inside: avoid; }
  .contract-preview .sig-table td { border: none; padding: 0 12px 0 0; text-align: left; vertical-align: top; width: 50%; }
  .contract-preview .sig-table td.sig-right { padding: 0 0 0 12px; }
  .contract-preview .requisites-table { width: 100%; border: none; border-collapse: collapse; margin: 4px 0; page-break-inside: avoid; break-inside: avoid; }
  .contract-preview .requisites-table td { border: none; padding: 1px 6px 1px 0; text-align: left; vertical-align: top; font-size: 11pt; }
  .contract-preview .requisites-table td:first-child { width: 50%; }
  .contract-preview .appendix-block { margin-top: 30px; page-break-inside: avoid; break-inside: avoid; }

  @media print {
    body { background: #fff; padding: 0; margin: 0; }
    .form-panel { display: none !important; }
    .preview-panel { box-shadow: none !important; border: none !important; padding: 0 !important; max-height: none !important; overflow: visible !important; background: transparent !important; }
    .preview-panel .preview-header { display: none !important; }
    .btn-group { display: none !important; }
    .grid-2 { display: block !important; }
    .container { padding: 0 !important; max-width: 100% !important; }
    .header { display: none !important; }
    .contract-preview { font-size: 11pt !important; }
    .contract-preview table.data tr { background-color: transparent !important; }
    .contract-preview .center, .contract-preview strong, .contract-preview b { font-weight: 700 !important; }
    .contract-preview table.data { page-break-inside: avoid !important; break-inside: avoid !important; }
    .contract-preview .signatures { page-break-inside: avoid !important; break-inside: avoid !important; }
    .contract-preview .appendix-block { page-break-inside: avoid !important; break-inside: avoid !important; }
  }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
    .form-panel, .preview-panel { max-height: none; }
    .field-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 20px; flex-wrap: wrap; }
    .contract-preview .sig-table td { display: block; width: 100%; padding: 0 !important; margin-bottom: 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📄 Конструктор договора на СОУТ <small>заполните поля → готовый договор</small></h1>
    <div class="header-actions">
      <button class="btn btn-primary" id="updateBtn">🔄 Обновить</button>
      <button class="btn btn-success" id="printBtn">🖨️ Печать</button>
      <button class="btn btn-word" id="wordBtn">📥 Сохранить в Word</button>
    </div>
  </div>

  <div class="grid-2">
    <!-- ФОРМА -->
    <div class="form-panel">
      <h2>📝 Данные для договора</h2>

      <div class="field-row">
        <div class="field">
          <label>Номер договора</label>
          <input type="text" id="contractNumber" value="П-1055/СОУТ" />
        </div>
        <div class="field">
          <label>Дата договора</label>
          <input type="date" id="contractDate" />
        </div>
      </div>
      <div class="field">
        <label>Город заключения договора</label>
        <input type="text" id="contractCity" value="г. Санкт-Петербург" />
      </div>

      <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

      <div class="field" style="background: #f0f7fe; border-radius: 8px; padding: 10px 12px;">
        <label style="color: #003366; font-weight: 700;">🔍 Загрузка по ИНН</label>
        <div class="field-row" style="gap: 8px;">
          <input type="text" id="innSearch" placeholder="Введите ИНН" style="flex:1;" />
          <button class="btn btn-primary" id="loadInnBtn" style="padding: 6px 16px; font-size: 13px;">Загрузить</button>
        </div>
      </div>

      <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

      <div class="field"><label>ОПФ (полная)</label><input type="text" id="clientOpf" placeholder="Заполняется автоматически" readonly /></div>
      <div class="field"><label>ОПФ (краткая)</label><input type="text" id="clientOpfShort" placeholder="Заполняется автоматически" readonly /></div>
      <div class="field"><label>Наименование Заказчика</label><input type="text" id="clientName" placeholder="Например: «СФЕРА-МЕД»" /></div>
      <div class="field"><label>Юридический адрес</label><input type="text" id="clientAddress" placeholder="Например: г. Санкт-Петербург, наб. Чёрной речки, д. 41" /></div>
      <div class="field-row">
        <div class="field"><label>ИНН</label><input type="text" id="clientInn" /></div>
        <div class="field"><label>КПП</label><input type="text" id="clientKpp" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>ОГРН</label><input type="text" id="clientOgrn" /></div>
        <div class="field"><label>ОКПО</label><input type="text" id="clientOkpo" /></div>
      </div>
      <div class="field"><label>Руководитель (должность + ФИО)</label><input type="text" id="clientDirector" value="Генеральный директор Иванов Иван Иванович" /></div>

      <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

      <div class="field" style="background: #f0f7fe; border-radius: 8px; padding: 10px 12px;">
        <label style="color: #003366; font-weight: 700;">🏦 Банковские реквизиты</label>
        <div class="field-row" style="gap: 8px;">
          <input type="text" id="bankSearch" placeholder="БИК или название банка" style="flex:1;" />
          <button class="btn btn-primary" id="loadBankBtn" style="padding: 6px 16px; font-size: 13px;">Найти</button>
        </div>
      </div>

      <div class="field"><label>Банк и номер счёта</label><input type="text" id="clientBank" /></div>
      <div class="field-row">
        <div class="field"><label>р/с</label><input type="text" id="clientRs" /></div>
        <div class="field"><label>к/с</label><input type="text" id="clientKs" /></div>
      </div>
      <div class="field"><label>БИК</label><input type="text" id="clientBik" /></div>

      <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

      <div class="field-row">
        <div class="field"><label>Кол-во рабочих мест</label><input type="number" id="workplaces" value="10" min="1" /></div>
        <div class="field"><label>Цена за 1 место (вкл. НДС)</label><input type="number" id="pricePerPlace" value="1200" min="0" step="0.01" /></div>
      </div>
      <div class="field"><label>Ставка НДС (%)</label><input type="number" id="ndsRate" value="5" min="0" max="20" step="0.5" /></div>

      <div class="sum-block">
        <div class="line"><span>Стоимость с НДС:</span><strong id="totalWithNds">12 000 ₽</strong></div>
        <div class="line"><span>НДС:</span><strong id="totalNds">571 ₽</strong></div>
        <div class="line total"><span>Без НДС:</span><span id="totalWithoutNds">11 429 ₽</span></div>
        <div class="num2text" id="totalWords"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="updateBtn2">🔄 Обновить</button>
        <button class="btn btn-success" id="printBtn2">🖨️ Печать</button>
        <button class="btn btn-word" id="wordBtn2">📥 Word</button>
      </div>
    </div>

    <!-- ПРЕВЬЮ -->
    <div class="preview-panel">
      <div class="preview-header">
        <span>📄 Превью договора</span>
        <span class="badge">Автообновление</span>
      </div>
      <div id="contractPreview" class="contract-preview"></div>
    </div>
  </div>
</div>

<script>
// =============================================
// 1. РЕКВИЗИТЫ ИСПОЛНИТЕЛЯ
// =============================================
const executor = {
  fullName: 'Общество с ограниченной ответственностью «ЭкоЛаб-Эксперт»',
  shortName: 'ООО «ЭкоЛаб-Эксперт»',
  inn: '7816309879', kpp: '783901001', ogrn: '1157847410600', okpo: '31988075',
  address: '190020, г. Санкт-Петербург, ул. Бумажная, д.17, лит.А, оф.416',
  director: 'Генеральный директор Журилова Александра Андреевна',
  bank: 'р/с 40702810410000626876 в АО «ТБанк»',
  rs: '40702810410000626876', ks: '30101810145250000974', bik: '044525974'
};

// =============================================
// 2. ЧИСЛО ПРОПИСЬЮ
// =============================================
function numToWords(num, female) {
  if (num === 0) return 'ноль';
  const units = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  const unitsF = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  const teens = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
  const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
  const hundreds = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
  function chunk(n, female) {
    let s = '';
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10;
    if (h) s += hundreds[h] + ' ';
    if (t === 1) s += teens[u] + ' ';
    else { if (t > 1) s += tens[t] + ' '; if (u) s += (female ? unitsF[u] : units[u]) + ' '; }
    return s.trim();
  }
  let s = String(Math.round(num)), chunks = [];
  while (s.length) { chunks.push(parseInt(s.slice(-3))); s = s.slice(0, -3); }
  chunks.reverse();
  const names = [{ name: '', female: false }, { name: 'тысяча', female: true }, { name: 'миллион', female: false }, { name: 'миллиард', female: false }];
  let result = '';
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i]; if (!c) continue;
    const idx = chunks.length - 1 - i;
    const n = names[idx] || { name: '', female: false };
    let part = chunk(c, n.female);
    if (n.name) {
      if (n.name === 'тысяча') {
        if (c === 1) part += ' тысяча';
        else if (c >= 2 && c <= 4) part += ' тысячи';
        else part += ' тысяч';
      } else {
        if (c === 1) part += ' ' + n.name;
        else if (c >= 2 && c <= 4) part += ' ' + n.name + 'а';
        else part += ' ' + n.name + 'ов';
      }
    }
    result += part + ' ';
  }
  return result.trim() || 'ноль';
}

function numToWordsGenitive(num) {
  if (num === 0) return 'ноля';
  const unitsGen = ['', 'одного', 'двух', 'трёх', 'четырёх', 'пяти', 'шести', 'семи', 'восьми', 'девяти'];
  const unitsFGen = ['', 'одной', 'двух', 'трёх', 'четырёх', 'пяти', 'шести', 'семи', 'восьми', 'девяти'];
  const teensGen = ['десяти', 'одиннадцати', 'двенадцати', 'тринадцати', 'четырнадцати', 'пятнадцати', 'шестнадцати', 'семнадцати', 'восемнадцати', 'девятнадцати'];
  const tensGen = ['', '', 'двадцати', 'тридцати', 'сорока', 'пятидесяти', 'шестидесяти', 'семидесяти', 'восьмидесяти', 'девяноста'];
  const hundredsGen = ['', 'ста', 'двухсот', 'трёхсот', 'четырёхсот', 'пятисот', 'шестисот', 'семисот', 'восьмисот', 'девятисот'];
  function chunkGen(n, female) {
    let s = '';
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10;
    if (h) s += hundredsGen[h] + ' ';
    if (t === 1) s += teensGen[u] + ' ';
    else { if (t > 1) s += tensGen[t] + ' '; if (u) s += (female ? unitsFGen[u] : unitsGen[u]) + ' '; }
    return s.trim();
  }
  let s = String(Math.round(num));
  const chunks = [];
  while (s.length) { chunks.push(parseInt(s.slice(-3))); s = s.slice(0, -3); }
  chunks.reverse();
  const groupForms = [
    null,
    { one: 'тысячи', few: 'тысяч', many: 'тысяч', female: true },
    { one: 'миллиона', few: 'миллионов', many: 'миллионов', female: false },
    { one: 'миллиарда', few: 'миллиардов', many: 'миллиардов', female: false }
  ];
  let result = '';
  for (let i = 0; i < chunks.length; i++) {
    const c = chunks[i]; if (!c) continue;
    const idx = chunks.length - 1 - i;
    const g = groupForms[idx];
    let part = chunkGen(c, g ? g.female : false);
    if (g) {
      const last = c % 10, preLast = Math.floor((c % 100) / 10);
      let word;
      if (preLast === 1) word = g.many;
      else if (last === 1) word = g.one;
      else if (last >= 2 && last <= 4) word = g.few;
      else word = g.many;
      part += ' ' + word;
    }
    result += part + ' ';
  }
  return result.trim() || 'ноля';
}

function rublesWord(num) {
  const last = num % 10, preLast = Math.floor((num % 100) / 10);
  if (preLast === 1) return 'рублей';
  if (last === 1) return 'рубль';
  if (last >= 2 && last <= 4) return 'рубля';
  return 'рублей';
}

function kopecksWord(num) {
  const last = num % 10, preLast = Math.floor((num % 100) / 10);
  if (preLast === 1) return 'копеек';
  if (last === 1) return 'копейка';
  if (last >= 2 && last <= 4) return 'копейки';
  return 'копеек';
}

function formatMoney(amount) {
  const rub = Math.floor(amount + 1e-9);
  const kop = Math.round((amount - rub) * 100);
  return rub.toLocaleString('ru-RU') + ',' + String(kop).padStart(2, '0');
}

function amountInWords(amount) {
  const rub = Math.floor(amount + 1e-9);
  const kop = Math.round((amount - rub) * 100);
  const rubWords = numToWords(rub);
  return `${formatMoney(amount)} (${rubWords} ${rublesWord(rub)} ${String(kop).padStart(2, '0')} ${kopecksWord(kop)})`;
}

function workplacesDeclension(num) {
  const last = num % 10, preLast = Math.floor((num % 100) / 10);
  if (preLast === 1) return 'рабочих мест';
  if (last === 1) return 'рабочее место';
  if (last >= 2 && last <= 4) return 'рабочих места';
  return 'рабочих мест';
}

// =============================================
// 3. СКЛОНЕНИЕ ФИО
// =============================================
function splitPositionAndName(director) {
  const parts = director.trim().split(/\s+/);
  const positionWords = ['генеральный', 'исполнительный', 'финансовый', 'коммерческий', 'технический', 'директор', 'президент', 'председатель', 'руководитель', 'начальник', 'заместитель', 'зам', 'зам.', 'индивидуальный', 'предприниматель', 'ип'];
  let positionEnd = 0;
  for (let i = 0; i < parts.length; i++) {
    const w = parts[i].toLowerCase().replace(/\./g, '');
    if (positionWords.includes(w) || positionWords.includes(parts[i].toLowerCase())) positionEnd = i + 1;
    else break;
  }
  if (positionEnd === 0) positionEnd = 1;
  return {
    position: parts.slice(0, positionEnd).join(' '),
    name: parts.slice(positionEnd).join(' ')
  };
}

function detectGender(fio) {
  const { name } = splitPositionAndName(fio);
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 3) {
    const patronymic = parts[2].toLowerCase();
    if (/(вна|ична)$/.test(patronymic)) return 'female';
    if (/(вич|ич)$/.test(patronymic)) return 'male';
  }
  if (parts.length >= 1) {
    const surname = parts[0].toLowerCase();
    if (/(ова|ева|ёва|ина|ына|ская|цкая|ая|яя)$/.test(surname)) return 'female';
  }
  return 'male';
}

function formatPosition(pos) {
  const trimmed = pos.trim();
  if (!trimmed) return trimmed;
  if (trimmed === trimmed.toUpperCase()) return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
  return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
}

function declinePosition(position) {
  const lower = position.toLowerCase();
  const map = [
    [/генеральный\s+директор/, 'Генерального директора'],
    [/исполнительный\s+директор/, 'Исполнительного директора'],
    [/финансовый\s+директор/, 'Финансового директора'],
    [/коммерческий\s+директор/, 'Коммерческого директора'],
    [/технический\s+директор/, 'Технического директора'],
    [/индивидуальный\s+предприниматель/, 'Индивидуального предпринимателя'],
    [/директор/, 'Директора'],
    [/президент/, 'Президента'],
    [/председатель/, 'Председателя'],
    [/руководитель/, 'Руководителя'],
    [/начальник/, 'Начальника'],
    [/заместитель/, 'Заместителя'],
  ];
  for (const [re, repl] of map) if (re.test(lower)) return repl;
  return position;
}

function declineLastName(ln, gender) {
  if (gender === 'female') {
    if (/(ова|ева|ёва|ина|ына)$/i.test(ln)) return ln.slice(0, -1) + 'ой';
    if (/ая$/i.test(ln)) return ln.slice(0, -2) + 'ой';
    if (/яя$/i.test(ln)) return ln.slice(0, -2) + 'ей';
    if (/а$/i.test(ln)) return ln.slice(0, -1) + 'ы';
    if (/я$/i.test(ln)) return ln.slice(0, -1) + 'и';
    return ln;
  }
  if (/(ий|ой|ый)$/i.test(ln)) return ln.slice(0, -2) + 'ого';
  if (/ая$/i.test(ln)) return ln.slice(0, -2) + 'ого';
  if (/яя$/i.test(ln)) return ln.slice(0, -2) + 'его';
  if (/а$/i.test(ln)) return ln.slice(0, -1) + 'ы';
  if (/я$/i.test(ln)) return ln.slice(0, -1) + 'и';
  if (/ь$/i.test(ln)) return ln.slice(0, -1) + 'я';
  if (/й$/i.test(ln)) return ln.slice(0, -1) + 'я';
  return ln + 'а';
}

function declineFirstName(fn, gender) {
  if (gender === 'female') {
    if (/а$/i.test(fn)) return fn.slice(0, -1) + 'ы';
    if (/я$/i.test(fn)) return fn.slice(0, -1) + 'и';
    return fn;
  }
  if (/а$/i.test(fn)) return fn.slice(0, -1) + 'ы';
  if (/я$/i.test(fn)) return fn.slice(0, -1) + 'и';
  if (/[йь]$/i.test(fn)) return fn.slice(0, -1) + 'я';
  return fn + 'а';
}

function declinePatronymic(mn, gender) {
  if (gender === 'female') {
    if (/вна$/i.test(mn)) return mn.slice(0, -2) + 'ны';
    if (/ична$/i.test(mn)) return mn.slice(0, -1) + 'ы';
    return mn;
  }
  if (/вич$/i.test(mn)) return mn + 'а';
  if (/ич$/i.test(mn)) return mn + 'а';
  return mn + 'а';
}

function declineFIO(director) {
  const { position, name } = splitPositionAndName(director);
  if (!name) return director;
  const gender = detectGender(director);
  const parts = name.trim().split(/\s+/);
  const dp = declinePosition(position);
  if (parts.length === 3) {
    return `${dp} ${declineLastName(parts[0], gender)} ${declineFirstName(parts[1], gender)} ${declinePatronymic(parts[2], gender)}`;
  }
  if (parts.length === 2) {
    return `${dp} ${declineLastName(parts[0], gender)} ${declineFirstName(parts[1], gender)}`;
  }
  return `${dp} ${name}`;
}

function formatDirectorPosition(director) {
  const { position, name } = splitPositionAndName(director);
  return `${formatPosition(position)} ${name}`.trim();
}

function getPositionOnly(director) {
  const { position } = splitPositionAndName(director);
  return formatPosition(position);
}

function getInitials(director) {
  const { name } = splitPositionAndName(director);
  const parts = name.trim().split(/\s+/);
  if (parts.length < 2) return name;
  const surname = parts[0];
  const initials = parts.slice(1).map(p => (p.charAt(0) || '').toUpperCase() + '.').join('');
  return `${surname} ${initials}`;
}

function getGender(director) { return detectGender(director); }

    <div class="section-title">5. ПОРЯДОК СДАЧИ И ПРИЕМКИ УСЛУГ</div>
    <p><b>5.1.</b> Услуги ИСПОЛНИТЕЛЯ считается оказанными после получения Заказчиком полного комплекта документов, определенного Федеральным законом Российской Федерации от 28 декабря 2013 г. N 426-ФЗ «О специальной оценке условий труда», Приложением №1 к Приказу Министерства труда и социальной защиты Российской Федерации от 21 ноября 2023 г. N 817н «Об утверждении методики проведения специальной оценки условий труда, классификатора вредных и (или) опасных производственных факторов, формы отчета о проведении специальной оценки условий труда и инструкции по ее заполнению», оформленных надлежащим образом и содержащих все необходимые сведения.</p>
    <p><b>5.2.</b> Приемка услуг по настоящему Договору оформляется двухсторонним универсальным передаточным документом (УПД), в течение 5 (пяти) рабочих дней с даты получения Заказчиком материалов по проведенной специальной оценки условий труда от ИСПОЛНИТЕЛЯ (по сопроводительной записке ИСПОЛНИТЕЛЯ).</p>
    <p><b>5.3.</b> При неполучении от Заказчика подписанного УПД или мотивированного отказа от их приемки в установленный срок, ИСПОЛНИТЕЛЬ составляет односторонний УПД.</p>
    <p><b>5.4.</b> Дата подписания УПД, считается датой 100% выполнения ИСПОЛНИТЕЛЕМ своих обязательств по настоящему Договору.</p>

    <div class="section-title">6. ОТВЕТСТВЕННОСТЬ СТОРОН</div>
    <p><b>6.1.</b> За невыполнение или ненадлежащее выполнение обязательств по настоящему Договору Стороны несут ответственность в соответствии с условиями настоящего Договора, а в случаях, не предусмотренных им, в соответствии с действующим законодательством Российской Федерации.</p>
    <p><b>6.2.</b> За нарушение работодателем Федерального закона РФ от 28 декабря 2013 г. N 426-ФЗ «О специальной оценке условий труда» в части порядка и правил проведения специальной оценки условий труда, ответственность возлагается на Заказчика.</p>
    <p><b>6.3.</b> За существенное нарушение Заказчиком п. 3.6 настоящего Договора, что явилось единственной причиной привлечения ИСПОЛНИТЕЛЯ к административной ответственности и уплате им административного штрафа, уплаченные штрафные санкции ГИТ ФГИС возмещаются Заказчиком.</p>
    <p><b>6.4.</b> Стороны гарантируют полное соблюдение всех условий обработки, хранения и использования полученных персональных данных, в соответствии с Федеральным Законом «О персональных данных» от 27.07.2006 № 152-ФЗ.</p>
    <p><b>6.5.</b> За нарушение сроков оказания услуг Исполнителем Заказчик вправе потребовать от Исполнителя уплаты штрафной неустойки (пени) в размере 0,1% от стоимости несвоевременно оказанных услуг за каждый день просрочки.</p>

    <div class="section-title">7. РАСТОРЖЕНИЕ ДОГОВОРА</div>
    <p><b>7.1.</b> В случае задержки или отказа Заказчика предоставить необходимую для оказания услуг информацию, ИСПОЛНИТЕЛЬ имеет право на увеличение сроков оказания услуг по настоящему Договору на аналогичное количество дней, либо требовать расторжения Договора в случае, если Заказчик задерживает предоставление необходимой для оказания услуг информации более чем на 10 рабочих дней.</p>
    <p><b>7.2.</b> В случае расторжения Договора, Заказчик оплачивает стоимость фактически оказанных и документально подтвержденных услуг ИСПОЛНИТЕЛЯ по настоящему Договору, за исключением случаев расторжения Договора по основаниям, указанным в п. 7.3 Договора.</p>
    <p><b>7.3.</b> Договор расторгается, если государственными органами принимаются акты, лишающие права ИСПОЛНИТЕЛЯ на оказание услуг.</p>
    <p><b>7.4.</b> В случае расторжения договора по основаниям, указанным в пунктах 7.1. настоящего договора, при расхождении объема оказанных услуг, подтвержденных документально и оплаченной стоимости работ, ИСПОЛНИТЕЛЬ обязан в течение 5 (пяти) рабочих дней возвратить Заказчику все излишне уплаченные суммы на дату расторжения настоящего договора.</p>

    <div class="section-title">8. АРБИТРАЖ</div>
    <p><b>8.1.</b> Все споры, которые могут возникнуть из настоящего Договора или в связи с его исполнением и которые не удалось решить путем переговоров, подлежат разрешению в Арбитражном Суде города Санкт-Петербурга и Ленинградской области. Претензионный порядок обязателен. Срок ответа на претензию 15 рабочих дней с момента ее получения.</p>

    <div class="section-title">9. ПРОЧИЕ УСЛОВИЯ</div>
    <p><b>9.1.</b> Заказчик не вправе уклоняться от рассмотрения представленных ИСПОЛНИТЕЛЕМ материалов.</p>
    <p><b>9.2.</b> Все исправления и дополнения к настоящему Договору будут действительны только в том случае, если они выполнены в письменной форме и подписаны лицами, уполномоченными на то Сторонами.</p>
    <p><b>9.3.</b> Стороны признают равную юридическую силу собственноручной подписи и факсимиле подписи (воспроизведенное механическим способом с использованием клише) в материалах специальной оценки условий труда.</p>
    <p><b>9.4.</b> После получения Заказчиком материалов по проведению специальной оценки условий труда рабочих мест, по сопроводительной записке, при необходимости их корректировки, не связанной с ненадлежащим оказанием ИСПОЛНИТЕЛЕМ услуг, составляется дополнительное соглашение.</p>
    <p><b>9.5.</b> Настоящий Договор составлен в 2 (двух) идентичных экземплярах, имеющих одинаковую юридическую силу, по одному экземпляру для каждой Стороны.</p>
    <p><b>9.6.</b> Отношения между сторонами, не оговоренные в настоящем Договоре, регулируются в соответствии с действующим законодательством РФ.</p>

    <div class="section-title">10. ФОРС-МАЖОР</div>
    <p><b>10.1.</b> Стороны освобождаются от ответственности за неисполнение или ненадлежащее исполнение обязательств по настоящему договору, если это явилось следствием обстоятельств непреодолимой силы, возникших после заключения договора, как то: стихийные бедствия, забастовки, военные действия любого характера, постановления правительства или распоряжения государственных органов, препятствующие выполнению условий настоящего договора.</p>
    <p><b>10.2.</b> Документ, выданный соответствующим компетентным органом, является достаточным подтверждением наличия и продолжительности действия обстоятельств непреодолимой силы.</p>
    <p><b>10.3.</b> Сторона, ссылающаяся на обстоятельства непреодолимой силы, обязана незамедлительно информировать другую сторону о наступлении подобных обстоятельств в письменной форме.</p>

    <div class="section-title">11. ЮРИДИЧЕСКИЕ АДРЕСА И РЕКВИЗИТЫ СТОРОН</div>
    ${requisitesHTML}
    ${signaturesHTML}
  </div>`;

  const appendixHTML = `
  <div class="appendix-block">
    <div style="text-align:right;">
      <div class="bold">ПРИЛОЖЕНИЕ № 1</div>
      <div class="bold">к договору № ${number}</div>

    ${signaturesHTML}

  return mainPart + appendixHTML;
}

function updatePreview() {
  document.getElementById('contractPreview').innerHTML = generateContractHTML();
}

// =============================================
// 6. ЗАГРУЗКА ПО ИНН
// =============================================
const DADATA_API_KEY = 'f94f4386b5ec6bc654487fc994c0fba0fdad788c';

document.getElementById('loadInnBtn').addEventListener('click', function() {
  const inn = document.getElementById('innSearch').value.trim();
  if (inn.length < 10) { alert('Введите корректный ИНН'); return; }
  this.disabled = true; this.textContent = 'Загрузка...';
  fetch('https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Token ' + DADATA_API_KEY },
    body: JSON.stringify({ query: inn, count: 1 })
  })
  .then(r => {
    if (r.status === 403) throw new Error('❌ Неверный API-ключ');
    if (r.status === 429) throw new Error('❌ Превышен лимит');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    if (data.suggestions && data.suggestions.length > 0) {
      const org = data.suggestions[0].data;
      const opf = org.opf || {};
      document.getElementById('clientOpf').value = opf.full || opf.short || '';
      document.getElementById('clientOpfShort').value = opf.short || '';
      const name = org.name || {};
      document.getElementById('clientName').value = name.short || name.full || '';
      document.getElementById('clientAddress').value = (org.address && org.address.unrestricted_value) || '';
      document.getElementById('clientInn').value = org.inn || '';
      document.getElementById('clientKpp').value = org.kpp || '';
      document.getElementById('clientOgrn').value = org.ogrn || '';
      document.getElementById('clientOkpo').value = org.okpo || '';
      let director = '';
      if (org.management) director = (org.management.post || '') + ' ' + (org.management.name || '');
      document.getElementById('clientDirector').value = director.trim() || 'Генеральный директор Иванов Иван Иванович';
      updatePreview();
      alert('✅ Данные загружены!');
    } else { alert('❌ Организация не найдена'); }
  })
  .catch(e => alert(e.message))
  .finally(() => { this.disabled = false; this.textContent = 'Загрузить'; });
});

// =============================================
// 7. ПОИСК БАНКА
// =============================================
document.getElementById('loadBankBtn').addEventListener('click', function() {
  const query = document.getElementById('bankSearch').value.trim();
  if (query.length < 3) { alert('Введите БИК или название'); return; }
  this.disabled = true; this.textContent = 'Поиск...';
  fetch('https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/bank', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Token ' + DADATA_API_KEY },
    body: JSON.stringify({ query: query, count: 1 })
  })
  .then(r => r.json())
  .then(data => {
    if (data.suggestions && data.suggestions.length > 0) {
      const bank = data.suggestions[0].data;
      const bankName = (bank.name && (bank.name.p || bank.name.c || bank.name.s || bank.name.full)) || 'Неизвестный банк';
      document.getElementById('clientBank').value = 'р/с 407028' + (bank.bic || '') + ' в ' + bankName;
      document.getElementById('clientBik').value = bank.bic || '';
      document.getElementById('clientKs').value = '301018' + (bank.bic ? bank.bic.slice(0, 5) : '') + '0000000';
      updatePreview();
      alert('✅ Банк найден!');
    } else { alert('❌ Банк не найден'); }
  })
  .catch(e => alert(e.message))
  .finally(() => { this.disabled = false; this.textContent = 'Найти'; });
});

// 8. ЭКСПОРТ В WORD
// =============================================
function exportToWord() {
  const clientOpfShort = document.getElementById('clientOpfShort').value || '';
  const clientName = document.getElementById('clientName').value || 'КИБО';
  const cleanName = clientName.replace(/^[«"]|[»"]$/g, '').trim();
  const shortName = clientOpfShort ? `${clientOpfShort} ${cleanName}` : cleanName;
  const number = document.getElementById('contractNumber').value || 'П-0000/СОУТ';
  const cleanNumber = number.replace(/[\/\s]/g, '');
  const fileName = `СОУТ_${shortName}_${cleanNumber}.doc`;
  const html = generateContractHTML();
  const fullHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>Договор СОУТ</title>
  <style>
    @page { size: A4; margin: 2cm 1.5cm; }
    body { font-family: 'Arial Narrow', Arial, sans-serif; font-size: 11pt; line-height: 1.4; color: #000; }
    .center { text-align: center; } .bold { font-weight: bold; }
    table.data { border-collapse: collapse; width: 100%; margin: 8px auto; font-size: 10pt; page-break-inside: avoid; }
    table.data td, table.data th { border: 1px solid #000; padding: 4px 8px; text-align: center; page-break-inside: avoid; }
    table.data tr { page-break-inside: avoid; }
    table.data td:first-child, table.data th:first-child { width: 40px; }
    table.data td:nth-child(2) { text-align: left; }
    table.data td:last-child, table.data th:last-child { text-align: right; }
    table.sig-table { border: none; border-collapse: collapse; width: 100%; margin-top: 24px; page-break-inside: avoid; }
    table.sig-table td { border: none; padding: 0 12px 0 0; vertical-align: top; text-align: left; }
    table.requisites-table { border: none; border-collapse: collapse; width: 100%; page-break-inside: avoid; }
    table.requisites-table td { border: none; padding: 1px 6px 1px 0; vertical-align: top; text-align: left; font-size: 11pt; }
    ul { padding-left: 25px; margin: 4px 0; }
    p { margin: 6px 0; text-align: justify; text-indent: 1.25cm; }
    p.no-indent { text-indent: 0; }
    .section-title { text-align: center; font-weight: bold; margin-top: 16px; margin-bottom: 8px; font-size: 12pt; page-break-after: avoid; }
    .appendix-block { margin-top: 30px; page-break-inside: avoid; }
  </style></head><body>${html}</body></html>`;
  const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);
}
