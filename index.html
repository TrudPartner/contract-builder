<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конструктор договора на СОУТ</title>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #e9eff5;
      padding: 30px 20px;
      color: #111;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 26px;
      color: #003366;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 small {
      font-size: 15px;
      font-weight: 400;
      color: #4a6f8f;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 22px;
      border: none;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary {
      background: #003366;
      color: #fff;
    }
    .btn-primary:hover {
      background: #002244;
    }
    .btn-success {
      background: #1e8b4c;
      color: #fff;
    }
    .btn-success:hover {
      background: #15703d;
    }
    .btn-word {
      background: #2b5797;
      color: #fff;
    }
    .btn-word:hover {
      background: #1d3f6e;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 28px;
    }

    .form-panel {
      background: #fff;
      border-radius: 24px;
      padding: 24px 26px;
      box-shadow: 0 8px 30px rgba(0, 30, 60, 0.08);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
    }
    .form-panel::-webkit-scrollbar {
      width: 4px;
    }
    .form-panel::-webkit-scrollbar-thumb {
      background: #b6ccdd;
      border-radius: 10px;
    }

    .form-panel h2 {
      font-size: 17px;
      color: #003366;
      border-bottom: 2px solid #e6f0fa;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #1a3a5f;
      margin-bottom: 3px;
    }
    .field input {
      width: 100%;
      padding: 7px 11px;
      border: 1px solid #d0dcec;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.15s;
      background: #fff;
    }
    .field input:focus {
      border-color: #2b7bb6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(43, 123, 182, 0.12);
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .sum-block {
      background: #f8faff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
    }
    .sum-block .line {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 3px 0;
    }
    .sum-block .line.total {
      font-size: 18px;
      font-weight: 700;
      color: #003366;
      border-top: 2px solid #e6f0fa;
      padding-top: 8px;
      margin-top: 4px;
    }
    .sum-block .num2text {
      text-align: right;
      font-size: 13px;
      color: #1a3a5f;
      font-style: italic;
      margin-top: 4px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .preview-panel {
      background: #fff;
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 8px 30px rgba(0, 30, 60, 0.08);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      position: relative;
    }
    .preview-panel::-webkit-scrollbar {
      width: 4px;
    }
    .preview-panel::-webkit-scrollbar-thumb {
      background: #b6ccdd;
      border-radius: 10px;
    }

    .preview-panel .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e6f0fa;
      padding-bottom: 12px;
      margin-bottom: 16px;
      font-size: 17px;
      font-weight: 700;
      color: #003366;
    }
    .preview-panel .preview-header .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 40px;
      background: #e1f3e6;
      color: #1a6e3a;
    }

    .contract-preview {
      font-family: 'Arial Narrow', Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.4;
      color: #000000;
      white-space: pre-wrap;
      padding: 0;
    }

    @media print {
      body {
        background: #fff;
        padding: 0.3in;
        margin: 0;
      }
      .form-panel {
        display: none !important;
      }
      .preview-panel {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        background: transparent !important;
      }
      .preview-panel .preview-header {
        display: none !important;
      }
      .btn-group {
        display: none !important;
      }
      .grid-2 {
        display: block !important;
      }
      .container {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .header {
        display: none !important;
      }
      .contract-preview {
        font-size: 11pt !important;
        white-space: pre-wrap !important;
        color: #000000 !important;
      }
      .page-break {
        page-break-after: always;
      }
    }

    @media (max-width: 900px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .form-panel,
      .preview-panel {
        max-height: none;
      }
      .field-row {
        grid-template-columns: 1fr;
      }
      .header h1 {
        font-size: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>📄 Конструктор договора на СОУТ <small>заполните поля → готовый договор</small></h1>
      <div class="header-actions">
        <button class="btn btn-primary" id="updateBtn">🔄 Обновить</button>
        <button class="btn btn-success" id="printBtn">🖨️ Печать</button>
        <button class="btn btn-word" id="wordBtn">📥 Сохранить в Word</button>
      </div>
    </div>

    <div class="grid-2">

      <div class="form-panel">
        <h2>📝 Данные для договора</h2>

        <div class="field-row">
          <div class="field">
            <label>Номер договора</label>
            <input type="text" id="contractNumber" value="П-1027/СОУТ" />
          </div>
          <div class="field">
            <label>Дата договора</label>
            <input type="date" id="contractDate" />
          </div>
        </div>

        <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

        <div class="field" style="background: #f0f7fe; border-radius: 8px; padding: 10px 12px;">
          <label style="color: #003366; font-weight: 700;">🔍 Загрузка по ИНН</label>
          <div class="field-row" style="gap: 8px;">
            <input type="text" id="innSearch" placeholder="Введите ИНН" style="flex:1;" />
            <button class="btn btn-primary" id="loadInnBtn" style="padding: 6px 16px; font-size: 13px;">Загрузить</button>
          </div>
        </div>

        <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

        <div class="field">
          <label>Наименование Заказчика</label>
          <input type="text" id="clientName" placeholder="Например: ООО «СФЕРА-МЕД»" />
        </div>
        <div class="field">
          <label>Юридический адрес</label>
          <input type="text" id="clientAddress" placeholder="Например: г. Санкт-Петербург, наб. Чёрной речки, д. 41" />
        </div>
        <div class="field-row">
          <div class="field"><label>ИНН</label><input type="text" id="clientInn" placeholder="0000000000" /></div>
          <div class="field"><label>КПП</label><input type="text" id="clientKpp" placeholder="000000000" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>ОГРН</label><input type="text" id="clientOgrn" placeholder="0000000000000" /></div>
          <div class="field"><label>ОКПО</label><input type="text" id="clientOkpo" placeholder="00000000" /></div>
        </div>
        <div class="field">
          <label>Руководитель (должность + ФИО)</label>
          <input type="text" id="clientDirector" placeholder="Например: Генеральный директор Ванин Д.Н." />
        </div>

        <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

        <div class="field" style="background: #f0f7fe; border-radius: 8px; padding: 10px 12px;">
          <label style="color: #003366; font-weight: 700;">🏦 Банковские реквизиты</label>
          <div class="field-row" style="gap: 8px;">
            <input type="text" id="bankSearch" placeholder="Введите БИК или название банка" style="flex:1;" />
            <button class="btn btn-primary" id="loadBankBtn" style="padding: 6px 16px; font-size: 13px;">Найти банк</button>
          </div>
        </div>

        <div class="field">
          <label>Банк и номер счёта</label>
          <input type="text" id="clientBank" placeholder="Например: р/с 407028... в ПАО «МТС-Банк»" />
        </div>
        <div class="field-row">
          <div class="field"><label>р/с</label><input type="text" id="clientRs" placeholder="40702810900000056544" /></div>
          <div class="field"><label>к/с</label><input type="text" id="clientKs" placeholder="30101810600000000232" /></div>
        </div>
        <div class="field">
          <label>БИК</label>
          <input type="text" id="clientBik" placeholder="044525232" />
        </div>

        <hr style="border: none; border-top: 2px solid #e6f0fa; margin: 14px 0;" />

        <div class="field-row">
          <div class="field">
            <label>Кол-во рабочих мест</label>
            <input type="number" id="workplaces" value="10" min="1" />
          </div>
          <div class="field">
            <label>Цена за 1 место (руб.)</label>
            <input type="number" id="pricePerPlace" value="1200" min="0" step="100" />
          </div>
        </div>
        <div class="field">
          <label>Ставка НДС (%)</label>
          <input type="number" id="ndsRate" value="5" min="0" max="20" step="0.5" />
        </div>

        <div class="sum-block">
          <div class="line"><span>Стоимость без НДС:</span><strong id="totalWithoutNds">12 000 ₽</strong></div>
          <div class="line" style="color:#555;"><span>НДС (5%):</span><strong id="totalNds">600 ₽</strong></div>
          <div class="line total"><span>Итого с НДС:</span><span id="totalWithNds">12 600 ₽</span></div>
          <div class="num2text" id="totalWords">Двенадцать тысяч шестьсот рублей 00 копеек</div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="updateBtn2">🔄 Обновить договор</button>
          <button class="btn btn-success" id="printBtn2">🖨️ Печать</button>
          <button class="btn btn-word" id="wordBtn2">📥 Сохранить в Word</button>
        </div>
      </div>

      <div class="preview-panel">
        <div class="preview-header">
          <span>📄 Превью договора</span>
          <span class="badge">Автообновление</span>
        </div>
        <div id="contractPreview" class="contract-preview">
          <!-- Сгенерированный договор -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // =============================================
    // 1. НАШИ РЕКВИЗИТЫ (ИСПОЛНИТЕЛЬ)
    // =============================================
    const executor = {
      name: 'ООО «ЭкоЛаб-Эксперт»',
      inn: '7816309879',
      kpp: '783901001',
      ogrn: '1157847410600',
      okpo: '31988075',
      address: '190020, г. Санкт-Петербург, ул. Бумажная, д.17, лит.А, оф.416',
      director: 'Генеральный директор Журилова Александра Андреевна',
      bank: 'р/с 40702810410000626876 в АО «ТБанк»',
      rs: '40702810410000626876',
      ks: '30101810145250000974',
      bik: '044525974'
    };

    // =============================================
    // 2. ФУНКЦИЯ ПРОПИСЬЮ
    // =============================================
    function numToWords(num) {
      if (num === 0) return 'ноль';
      const units = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
      const unitsF = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
      const teens = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать',
        'семнадцать', 'восемнадцать', 'девятнадцать'
      ];
      const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят',
        'девяносто'
      ];
      const hundreds = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот',
        'девятьсот'
      ];

      function chunk(n, female) {
        let s = '';
        const h = Math.floor(n / 100);
        const t = Math.floor((n % 100) / 10);
        const u = n % 10;
        if (h) s += hundreds[h] + ' ';
        if (t === 1) s += teens[u] + ' ';
        else {
          if (t > 1) s += tens[t] + ' ';
          if (u) s += (female ? unitsF[u] : units[u]) + ' ';
        }
        return s.trim();
      }

      let s = String(Math.round(num));
      let chunks = [];
      while (s.length) { chunks.push(parseInt(s.slice(-3)));
        s = s.slice(0, -3); }
      chunks.reverse();
      const names = [
        { name: '', female: false },
        { name: 'тысяча', female: true },
        { name: 'миллион', female: false },
        { name: 'миллиард', female: false }
      ];
      let result = '';
      for (let i = 0; i < chunks.length; i++) {
        const c = chunks[i];
        if (!c) continue;
        const idx = chunks.length - 1 - i;
        const n = names[idx] || { name: '', female: false };
        let part = chunk(c, n.female);
        if (n.name) {
          if (n.name === 'тысяча') {
            if (c === 1) part += ' тысяча';
            else if (c >= 2 && c <= 4) part += ' тысячи';
            else part += ' тысяч';
          } else {
            if (c === 1) part += ' ' + n.name;
            else if (c >= 2 && c <= 4) part += ' ' + n.name + 'а';
            else part += ' ' + n.name + 'ов';
          }
        }
        result += part + ' ';
      }
      return result.trim() || 'ноль';
    }

    function rublesToWords(amount) {
      const rub = Math.floor(amount);
      const kop = Math.round((amount - rub) * 100);
      let r = numToWords(rub);
      if (!r) r = 'ноль';
      const last = rub % 10;
      const preLast = Math.floor((rub % 100) / 10);
      let rubWord = 'рублей';
      if (preLast !== 1) {
        if (last === 1) rubWord = 'рубль';
        else if (last >= 2 && last <= 4) rubWord = 'рубля';
      }
      return r + ' ' + rubWord + ' ' + String(kop).padStart(2, '0') + ' копеек';
    }

    // =============================================
    // 3. ГЕНЕРАЦИЯ ДОГОВОРА
    // =============================================
    function generateContract() {
      const number = document.getElementById('contractNumber').value || 'П-1027/СОУТ';
      const dateRaw = document.getElementById('contractDate').value;
      let date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      if (dateRaw) {
        date = new Date(dateRaw).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      }

      const clientName = document.getElementById('clientName').value || 'ООО «Заказчик»';
      const clientAddress = document.getElementById('clientAddress').value || 'г. Москва, ул. Примерная, д. 1';
      const clientInn = document.getElementById('clientInn').value || '0000000000';
      const clientKpp = document.getElementById('clientKpp').value || '000000000';
      const clientOgrn = document.getElementById('clientOgrn').value || '0000000000000';
      const clientOkpo = document.getElementById('clientOkpo').value || '00000000';
      const clientDirector = document.getElementById('clientDirector').value || 'Генеральный директор Иванов И.И.';
      const clientBank = document.getElementById('clientBank').value || 'р/с 00000000000000000000 в АО «Банк»';
      const clientRs = document.getElementById('clientRs').value || '40702810000000000000';
      const clientKs = document.getElementById('clientKs').value || '30101810100000000000';
      const clientBik = document.getElementById('clientBik').value || '044525000';

      const workplaces = parseInt(document.getElementById('workplaces').value) || 10;
      const price = parseFloat(document.getElementById('pricePerPlace').value) || 1200;
      const ndsRate = parseFloat(document.getElementById('ndsRate').value) || 5;

      const totalWithoutNds = workplaces * price;
      const ndsAmount = totalWithoutNds * (ndsRate / 100);
      const totalWithNds = totalWithoutNds + ndsAmount;

      document.getElementById('totalWithoutNds').textContent = totalWithoutNds.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('totalNds').textContent = ndsAmount.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('totalWithNds').textContent = totalWithNds.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('totalWords').textContent = rublesToWords(totalWithNds);

      const priceWords = numToWords(price);
      const totalWords = rublesToWords(totalWithNds);
      const workplacesWords = numToWords(workplaces);

      const table = `
      +------+---------------------------------------------+--------+-----------+------------------+------------------+
      |  №   |  Наименование услуг по настоящему договору  | Кол-во |    Ед.    |  Цена, в т.ч. НДС | Сумма, в т.ч. НДС |
      +------+---------------------------------------------+--------+-----------+------------------+------------------+
      |  1   |  Специальная оценка условий труда            |  ${String(workplaces).padStart(4)}   | Раб. мест |  ${String(price.toLocaleString('ru-RU')).padStart(12)}   |  ${String(totalWithNds.toLocaleString('ru-RU')).padStart(12)}   |
      +------+---------------------------------------------+--------+-----------+------------------+------------------+
      `;

      const signatures = `
      Заказчик:                                  Исполнитель:
      ${clientDirector}                          ${executor.director}
      ____________________                       ____________________
      `;

      return `
Договор № ${number}

на оказание услуг по проведению специальной оценки условий труда

г. Санкт-Петербург                                               «${date}»

${clientName}, именуемое в дальнейшем «Заказчик», в лице ${clientDirector}, действующего на основании Устава, с одной стороны и
${executor.name} (далее по тексту ${executor.name}), именуемое в дальнейшем «ИСПОЛНИТЕЛЬ», в лице ${executor.director}, действующей на основании Устава, с другой стороны, совместно именуемые Стороны, заключили настоящий Договор о нижеследующем:

1. ПРЕДМЕТ ДОГОВОРА

1.1. ЗАКАЗЧИК поручает, а ИСПОЛНИТЕЛЬ принимает на себя обязательство по проведению специальной оценки условий труда ${workplaces} (${workplacesWords}) рабочих мест, в объеме, определенном Федеральным законом Российской Федерации от 28 декабря 2013 г. N 426-ФЗ «О специальной оценке условий труда», Приложением №1 к Приказу Министерства труда и социальной защиты Российской Федерации от 21 ноября 2023 г. N 817н «Об утверждении методики проведения специальной оценки условий труда, классификатора вредных и (или) опасных производственных факторов, формы отчета о проведении специальной оценки условий труда и инструкции по ее заполнению».

1.2. Если при проведении специальной оценки условий труда выяснится необходимость корректировки числа оцениваемых рабочих мест, а именно, увеличения или уменьшения количества рабочих мест и, соответственно, изменения стоимости оказываемых услуг, составляется дополнительное соглашение.

1.3. ИСПОЛНИТЕЛЬ гарантирует ЗАКАЗЧИКУ свое соответствие требованиям, установленным ст. 19 Федерального закона от 28.12.2013 № 426-ФЗ «О специальной оценке условий труда».

2. СТОИМОСТЬ УСЛУГ И ПОРЯДОК РАСЧЕТОВ

2.1. Стоимость услуг по специальной оценке условий труда на одном рабочем месте составляет ${price.toLocaleString('ru-RU')} (${priceWords}) рублей 00 копеек, в т.ч. НДС ${ndsRate}% в соответствии с п.п.1 п.8 ст 164 НК РФ.

    function updatePreview() {
      const fullText = generateContract();
      const lines = fullText.split('\n');
      const linesPerPage = 58;
      const pages = [];
      let currentPage = [];
      for (let i = 0; i < lines.length; i++) {
        currentPage.push(lines[i]);
        if (currentPage.length >= linesPerPage && i < lines.length - 1) {
          pages.push(currentPage.join('\n'));
          currentPage = [];
        }
      }
      if (currentPage.length > 0) {
        pages.push(currentPage.join('\n'));
      }

      const totalPages = pages.length;
      let result = '';
      for (let i = 0; i < pages.length; i++) {
        const pageContent = pages[i];
        const pageNum = i + 1;
        const pageWithNumber = pageContent + '\n\n\n\n' + String(pageNum);
        result += pageWithNumber;
        if (i < pages.length - 1) {
          result += '\n\n\n---\n\n\n';
        }
      }
      document.getElementById('contractPreview').textContent = result;
    }

    const DADATA_API_KEY = 'f94f4386b5ec6bc654487fc994c0fba0fdad788c';

    document.getElementById('loadInnBtn').addEventListener('click', function() {
      const inn = document.getElementById('innSearch').value.trim();
      if (inn.length < 10) {
        alert('Введите корректный ИНН (10 или 12 цифр)');
        return;
      }

      this.disabled = true;
      this.textContent = 'Загрузка...';

      fetch('https://suggestions.dadata.ru/suggestions/api/4_1/rs/findById/party', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'Authorization': 'Token ' + DADATA_API_KEY
        },
        body: JSON.stringify({ 
          query: inn,
          count: 1
        })
      })
      .then(response => {
        if (response.status === 403) {
          throw new Error('❌ Неверный API-ключ. Проверьте ключ в личном кабинете dadata.ru');
        }
        if (response.status === 429) {
          throw new Error('❌ Превышен лимит запросов (10 000 в сутки)');
        }
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ': ' + response.statusText);
        }
        return response.json();
      })
      .then(data => {
        if (data.suggestions && data.suggestions.length > 0) {
          const org = data.suggestions[0].data;
          document.getElementById('clientName').value = org.name?.full || org.name?.short || '';
          document.getElementById('clientAddress').value = org.address?.unrestricted_value || '';
          document.getElementById('clientInn').value = org.inn || '';
          document.getElementById('clientKpp').value = org.kpp || '';
          document.getElementById('clientOgrn').value = org.ogrn || '';
          document.getElementById('clientOkpo').value = org.okpo || '';
          let director = '';
          if (org.management) {
            director = (org.management.post || '') + ' ' + (org.management.name || '');
          }
          document.getElementById('clientDirector').value = director.trim() || 'Не указан';
          updatePreview();
          alert('✅ Данные загружены!');
        } else {
          alert('❌ Организация по ИНН ' + inn + ' не найдена');
        }
      })
      .catch(error => {
        alert(error.message);
      })
      .finally(() => {
        this.disabled = false;
        this.textContent = 'Загрузить';
      });
    });

          updatePreview();
          alert('✅ Банк найден!');
        } else {
          alert('❌ Банк по запросу "' + query + '" не найден');
        }
      })
      .catch(error => {
        alert(error.message);
      })
      .finally(() => {
        this.disabled = false;
        this.textContent = 'Найти банк';
      });
    });

    // =============================================
    // 7. ЭКСПОРТ В WORD
    // =============================================
    function exportToWord() {
      const text = generateContract();
      const htmlContent = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office'
              xmlns:w='urn:schemas-microsoft-com:office:word'
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8">
          <style>
            body { font-family: 'Arial Narrow', Arial, sans-serif; font-size: 11pt; line-height: 1.4; color: #000000; }
            .center { text-align: center; font-weight: bold; }
            .bold { font-weight: bold; }
            .table { font-family: 'Courier New', monospace; font-size: 9pt; white-space: pre; }
          </style>
        </head>
        <body>
          <pre style="font-family: 'Arial Narrow', Arial, sans-serif; font-size: 11pt; line-height: 1.4; white-space: pre-wrap; color: #000000;">${text}</pre>
        </body>
        </html>
      `;

      const blob = new Blob([htmlContent], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Договор_СОУТ.doc';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // =============================================
    // 8. ИНИЦИАЛИЗАЦИЯ
    // =============================================
    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('contractDate').value = today;

      const inputs = document.querySelectorAll('input');
      inputs.forEach(inp => {
        inp.addEventListener('input', updatePreview);
        inp.addEventListener('change', updatePreview);
      });

      document.getElementById('updateBtn').addEventListener('click', updatePreview);
      document.getElementById('updateBtn2').addEventListener('click', updatePreview);

      document.getElementById('printBtn').addEventListener('click', function() {
        window.print();
      });
      document.getElementById('printBtn2').addEventListener('click', function() {
        window.print();
      });

      document.getElementById('wordBtn').addEventListener('click', exportToWord);
      document.getElementById('wordBtn2').addEventListener('click', exportToWord);

      updatePreview();
    });
  </script>
